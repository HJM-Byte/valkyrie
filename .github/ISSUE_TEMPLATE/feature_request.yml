name: Feature request
description: 想加一个功能或改一处体验
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 现在卡在哪里
      description: 说场景，不要只说“加个功能”
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界
      options:
        - label: 这个需求不依赖提交我的 API Key、记忆库或真实对话数据
          required: true
