name: Bug report
description: 安装、启动或运行时报错
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先删除本机路径、IP、API Key、记忆原文和人物信息。不要贴 `.env`、`data/` 或完整日志。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际结果和预期结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 解压到 ...
        2. 运行 install.cmd ...
        3. 运行 web.cmd（或 start.cmd 选 1）...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 / 57c41c7
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: Windows 版本、Python 版本、安装路径、是否用了 -Voice / -Models
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的报错
      description: 只贴报错行，不要贴 Key、Token、记忆或完整路径
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已删除 Key、Token、本机路径、记忆原文和人物信息
          required: true
